# Beobachtungsuniversum (Yahoo-Finance-Symbole). Frei anpassbar.
# Suffixe: .DE XETRA, .F Frankfurt, .L London (Kurse in Pence), .PA Paris, .AS Amsterdam,
# .SW Schweiz, .MI Mailand, .CO Kopenhagen, ohne Suffix = USA.
# Ein Symbol, das bei Yahoo nicht (mehr) existiert, erscheint als "nicht verfügbar".

market_overview:
  - {symbol: "^GDAXI", name: "DAX", kind: index}
  - {symbol: "^MDAXI", name: "MDAX", kind: index}
  - {symbol: "^GSPC", name: "S&P 500", kind: index}
  - {symbol: "^NDX", name: "NASDAQ 100", kind: index}
  - {symbol: "^DJI", name: "Dow Jones", kind: index}
  - {symbol: "EUNL.DE", name: "MSCI World", kind: etf_proxy, note: "iShares Core MSCI World ETF (XETRA) als Stellvertreter, der Index selbst ist frei nicht verfügbar"}
  - {symbol: "GC=F", name: "Gold", kind: commodity, note: "COMEX-Future, USD je Feinunze"}
  - {symbol: "SI=F", name: "Silber", kind: commodity, note: "COMEX-Future, USD je Feinunze"}
  - {symbol: "BZ=F", name: "Öl (Brent)", kind: commodity, note: "ICE-Future, USD je Barrel"}
  - {symbol: "BTC-EUR", name: "Bitcoin", kind: crypto}
  - {symbol: "ETH-EUR", name: "Ethereum", kind: crypto}

sentiment_instruments:
  vix: "^VIX"
  us10y: "^TNX"          # Rendite x10 bei Yahoo → wird durch 10 geteilt
  us3m: "^IRX"           # 13-Wochen-T-Bill, Näherung für den Geldmarktzins
  eurusd: "EURUSD=X"

overnight:
  - {symbol: "^N225", name: "Nikkei 225"}
  - {symbol: "^HSI", name: "Hang Seng"}
  - {symbol: "000001.SS", name: "Shanghai Composite"}
  - {symbol: "ES=F", name: "S&P-500-Future"}
  - {symbol: "NQ=F", name: "Nasdaq-100-Future"}

benchmarks:
  default: "EUNL.DE"
